name: Homebrew installation smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    steps:
      - name: Check developer tools
        run: |
          xcode-select -p
          clang --version
      - name: Install published tap formula
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew update
          brew tap thecolby/verbx
          brew install --build-from-source thecolby/verbx/verbx
      - name: Test installed package
        run: |
          brew test thecolby/verbx/verbx
          verbx version
          verbx --help
          verbx batch corpus-generate --help
          verbx doctor
          verbx quickstart --smoke-test --strict
      - name: Upload Homebrew build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-build-logs
          path: ~/Library/Logs/Homebrew/verbx
          if-no-files-found: ignore
