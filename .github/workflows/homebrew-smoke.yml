name: Homebrew installation smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected installed verbx version (blank checks the current tap)
        required: false
        type: string

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    env:
      VERBX_EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Check developer tools
        run: |
          xcode-select -p
          clang --version
      - name: Install published tap formula
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew update
          brew tap thecolby/verbx
          brew install --build-from-source thecolby/verbx/verbx
      - name: Test installed package
        run: |
          brew test thecolby/verbx/verbx
          verbx version
          app_python="$(brew --prefix thecolby/verbx/verbx)/libexec/bin/python"
          installed_version="$("$app_python" -c 'import verbx; print(verbx.__version__)')"
          if [ -n "$VERBX_EXPECTED_VERSION" ]; then
            test "$installed_version" = "$VERBX_EXPECTED_VERSION"
          fi
          verbx --help
          verbx batch corpus-generate --help
          verbx doctor
          verbx quickstart --smoke-test --strict
      - name: Upload Homebrew build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-build-logs
          path: ~/Library/Logs/Homebrew/verbx
          if-no-files-found: ignore
